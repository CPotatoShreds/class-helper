name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      # 仓库只保存 lib/ 与覆盖文件，android/ 脚手架由 flutter create 按固定
      # Flutter 版本生成，避免手写 Gradle 与官方模板漂移
      - name: Generate android scaffolding
        working-directory: app
        run: flutter create . --platforms android --project-name class_helper_app --org dev.classhelper

      - name: Apply manifest overlay and minSdk=23
        working-directory: app
        run: |
          cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/g; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          grep -n minSdk android/app/build.gradle

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: class-helper-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
