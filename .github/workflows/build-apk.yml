name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter --version && flutter doctor -v

      # 仓库只保存 lib/ 与覆盖文件，android/ 脚手架由 flutter create 按固定
      # Flutter 版本生成，避免手写 Gradle 与官方模板漂移
      - name: Generate android scaffolding
        working-directory: app
        run: flutter create . --platforms android --project-name class_helper_app --org dev.classhelper --verbose

      - name: Apply manifest overlay and minSdk=23
        working-directory: app
        run: |
          cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/g; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/g' "$f"
            # 新版 androidx 传递依赖要求 compileSdk 35，而 Flutter 3.24 模板固定 34
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 35/g; s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 35/g' "$f"
            grep -n -E "minSdk|compileSdk" "$f" || true
          done
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Dependency tree
        working-directory: app
        run: flutter pub deps --style=compact | head -60 || true

      # 插件子项目在 CI 上拿不到 flutter 扩展（如 record_android 的
      # `compileSdk = flutter.compileSdkVersion`），统一替换为字面值
      - name: Patch plugin build.gradle flutter.* references
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -name build.gradle -path "*/android/*" -exec sed -i -E \
            -e 's/flutter\.compileSdkVersion/35/g' \
            -e 's/flutter\.minSdkVersion/23/g' \
            -e 's/flutter\.targetSdkVersion/34/g' \
            -e 's/flutter\.ndkVersion/"26.1.10909125"/g' \
            -e 's/flutter\.versionCode/1/g' \
            -e 's/flutter\.versionName/"0.1.0"/g' \
            {} + && echo "patched: $(grep -rl 'flutter\.' $HOME/.pub-cache/hosted/pub.dev --include=build.gradle | wc -l) files still reference flutter.*"

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_output.log

      # 日志接口需管理员权限，改用 annotation 通道把报错带出（匿名 API 可读）
      - name: Emit failure context as annotations
        if: failure()
        working-directory: app
        run: |
          [ -f build_output.log ] || exit 0
          python3 - <<'PY'
          import re
          log = open('build_output.log', encoding='utf-8', errors='ignore').read()
          i = log.find('* Where:')
          if i == -1:
              i = log.rfind('FAILURE: Build failed')
          if i == -1:
              i = max(0, len(log) - 6000)
          j = log.find('BUILD FAILED', i)
          gradle_block = log[i : j + 2500] if j != -1 else log[i : i + 8000]
          # Dart 编译错误行（kernel/compiler 输出在日志中部）
          dart_lines = []
          lines = log.splitlines()
          for idx, line in enumerate(lines):
              if ('Error:' in line or 'error •' in line
                      or re.match(r'\s*(lib|test)/.*\.dart:\d+', line)
                      or 'Target kernel_snapshot failed' in line):
                  dart_lines.append(line.strip())
                  if idx + 1 < len(lines) and lines[idx + 1].strip():
                      dart_lines.append('  ↳ ' + lines[idx + 1].strip())
          dart_block = '\n'.join(dict.fromkeys(dart_lines))
          text = ('---DART ERRORS---\n' + (dart_block or '(none captured)'))[:12000] \
                 + '\n---GRADLE---\n' + gradle_block
          esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for k in range(0, min(len(esc), 32000), 3500):
              print(f'::error::E{k//3500} {esc[k:k+3500]}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: class-helper-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
