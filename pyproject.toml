[project]
name = "class-helper"
version = "0.1.0"
description = "代课bot：课堂听课值守、点名实时速答与课程归档"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
    "onnxruntime>=1.18",
    "openai>=1.40",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "qrcode>=7.4",
    "rich>=13.7",
    "zhconv>=1.4.3",
]

[project.scripts]
class-helper = "class_helper.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/class_helper"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
